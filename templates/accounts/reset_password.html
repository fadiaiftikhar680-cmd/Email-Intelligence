{% extends 'base.html' %}

{% block title %}Enter New Password | Email Intelligence Platform{% endblock %}

{% block public_content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.5rem;">
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Set New Password</h2>
    <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 1.5rem;">
      Choose a secure password of at least 12 characters.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="password">New Password (Min 12 chars)</label>
        <input type="password" id="password" name="password" class="form-input" required minlength="12" placeholder="••••••••••••">
      </div>

      <div class="form-group">
        <label class="form-label" for="password_confirm">Confirm New Password</label>
        <input type="password" id="password_confirm" name="password_confirm" class="form-input" required minlength="12" placeholder="••••••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
