{% extends 'base.html' %}

{% block title %}Sign In | Email Intelligence Platform{% endblock %}

{% block public_content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Sign In</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Access your dashboard, search history, and APIs.</p>
    </div>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="name@company.com">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          <a href="{% url 'forgot_password' %}" style="font-size: 0.82rem;">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{% url 'register' %}">Register now</a>
    </div>
  </div>
</div>
{% endblock %}
