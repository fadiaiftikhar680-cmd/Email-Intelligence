{% extends 'base.html' %}

{% block title %}Forgot Password | Email Intelligence Platform{% endblock %}

{% block public_content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.5rem;">
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Reset Password</h2>
    <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 1.5rem;">
      Enter your account email to receive single-use password reset instructions.
    </p>

    <form method="post" action="{% url 'forgot_password' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="email">Account Email</label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="you@company.com">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Instructions</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
      <a href="{% url 'login' %}">Back to Log in</a>
    </div>
  </div>
</div>
{% endblock %}
