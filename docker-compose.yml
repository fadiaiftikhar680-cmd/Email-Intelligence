services:
  db:
    image: postgres:16-alpine
    container_name: eip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: email_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: eip_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: eip_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=development
      - DB_ENGINE=postgres
      - POSTGRES_DB=email_intelligence
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: eip_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_ENV=development
      - DB_ENGINE=postgres
      - POSTGRES_DB=email_intelligence
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: eip_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_ENV=development
      - DB_ENGINE=postgres
      - POSTGRES_DB=email_intelligence
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

